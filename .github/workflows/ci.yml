name: ChampUI CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CHAMPUI_EVIDENCE_DIR: ${{ runner.temp }}/champui-evidence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build Playwright installer
        run: dotnet build tests/ChampUI.BrowserTests/ChampUI.BrowserTests.csproj -c Release
      - name: Install Chromium and system dependencies
        shell: pwsh
        run: ./tests/ChampUI.BrowserTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: Run the release regression suites
        run: bash verify_fixes.sh
      - name: Save regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: champui-regression
          path: ${{ env.CHAMPUI_EVIDENCE_DIR }}
          if-no-files-found: ignore
